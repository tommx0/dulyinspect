# Postgres of the instance (official Debian package). Data directory from PGDATA (/data/postgres).
hba_file = '/etc/instance/pg_hba.conf'
ident_file = '/etc/instance/pg_ident.conf'
unix_socket_directories = '/var/run/postgresql'
# Listen only on 127.0.0.1 (set by the db service); the temporary server during setup only via the socket
listen_addresses = ''
max_connections = 100
password_encryption = scram-sha-256

shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_wal_size = 512MB
min_wal_size = 80MB
# LLVM is not installed (Dockerfile)
jit = off

# Realtime reads changes via logical replication (wal2json, pgoutput)
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
max_slot_wal_keep_size = 1024
# Since 15.19 only explicitly allowed output plugins; Realtime needs wal2json (postgres_changes) and pgoutput (broadcast)
output_plugin_libraries = 'pgoutput, wal2json'

# pg_cron: locks the support access after it expires; connects via the socket (peer), TCP without password is blocked
shared_preload_libraries = 'pg_cron'
cron.database_name = 'postgres'
cron.host = '/var/run/postgresql'
cron.max_running_jobs = 2

timezone = 'UTC'
log_timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
# Never log statements: ALTER ROLE … PASSWORD would otherwise appear in plain text in the container log
log_statement = 'none'
log_min_messages = warning
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = off
