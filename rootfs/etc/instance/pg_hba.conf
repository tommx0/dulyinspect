# Superuser only via the socket for the OS user postgres, all services via 127.0.0.1 with a password.
# Postgres only listens on 127.0.0.1.
local all supabase_admin peer map=instance
local all postgres       peer map=instance
host  all all 127.0.0.1/32 scram-sha-256
host  all all ::1/128      scram-sha-256
