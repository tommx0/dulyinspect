# Build the image for Intel/AMD (linux/amd64), check it with the smoke test and provide it as a file
# (Actions → run → Artifacts: ZIP with the .tar for Synology Container Manager or docker load).
# The app source is part of this repository (app/, see app/SOURCE); no other repository or secret is needed.
name: Build image (amd64)

on:
  workflow_dispatch:
    inputs:
      ghcr:
        description: Also publish to ghcr.io (uses the account's package storage)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: image-amd64
  cancel-in-progress: false

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: v
        run: |
          echo "version=$(sed -n 's/^version=//p' app/SOURCE)" >> "$GITHUB_OUTPUT"
          echo "commit=$(sed -n 's/^commit=//p' app/SOURCE)" >> "$GITHUB_OUTPUT"

      # The runner has only about 14 GB free; the build needs room for the stages, the image and the .tar
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h / | tail -1

      # Build directly in the runner's Docker (no buildx container: it would keep a second copy of all layers)
      - name: Build
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.version=${{ steps.v.outputs.version }} \
            --label org.opencontainers.image.revision=${{ steps.v.outputs.commit }} \
            -t dulyinspect:${{ steps.v.outputs.version }} -t dulyinspect:latest .
          docker builder prune -af >/dev/null
          df -h / | tail -1

      - name: Smoke test
        run: test/smoke-test.sh dulyinspect:${{ steps.v.outputs.version }}

      # Classic docker-archive format (with "repositories"): Synology Container Manager rejects the OCI layout of docker save
      - name: Save as file
        run: |
          V=${{ steps.v.outputs.version }}
          docker save -o oci.tar dulyinspect:$V dulyinspect:latest
          ./classic-archive.sh oci.tar dulyinspect-$V-amd64.tar dulyinspect:$V dulyinspect:latest
          rm oci.tar
          ls -lh *.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dulyinspect-${{ steps.v.outputs.version }}-amd64
          path: dulyinspect-*-amd64.tar
          # Short retention: the artifact counts against the account's Actions storage
          retention-days: 5
          if-no-files-found: error

      - name: Publish to ghcr.io
        if: ${{ inputs.ghcr }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for t in ${{ steps.v.outputs.version }} latest; do
            docker tag dulyinspect:$t ghcr.io/tommx0/dulyinspect:$t
            docker push ghcr.io/tommx0/dulyinspect:$t
          done

      - name: Summary
        run: |
          {
            echo "### dulyinspect ${{ steps.v.outputs.version }} (amd64)"
            echo "App source: \`app/\` = app commit \`${{ steps.v.outputs.commit }}\`"
            echo "Download: Artifacts → dulyinspect-${{ steps.v.outputs.version }}-amd64 (unzip, import the .tar)"
          } >> "$GITHUB_STEP_SUMMARY"
